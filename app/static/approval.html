<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incident Remediation Approval</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      background: #f3f6fb;
      color: #1e293b;
    }

    main {
      background: white;
      width: min(100%, 510px);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 14px 40px rgba(20,40,75,.09);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.55rem;
    }

    p {
      margin: 0 0 24px;
      color: #64748b;
    }

    label {
      display: block;
      font-weight: 650;
      margin: 0 0 7px;
      font-size: .92rem;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }

    input:focus, textarea:focus {
      outline: 2px solid #93c5fd;
      border-color: #3b82f6;
    }

    .field {
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 13px 10px;
      border: none;
      border-radius: 8px;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .approve { background: #15803d; }
    .reject { background: #b91c1c; }

    #result {
      margin-top: 20px;
      padding: 12px 14px;
      border-radius: 8px;
      display: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #result.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #result.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    #result.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    small {
      display: block;
      margin-top: 18px;
      color: #64748b;
    }
  </style>
</head>

<body>
<main>

  <h1>Incident Remediation Approval</h1>

  <p>
    Review and approve or reject the proposed remediation action
    for an incident. Approved actions will be executed in simulation mode.
  </p>

  <div class="field">
    <label for="incidentId">Incident ID</label>
    <input
      id="incidentId"
      placeholder="inc-test-001"
      autocomplete="off"
      required
    />
  </div>

  <div class="field">
    <label for="comments">Comments (optional)</label>
    <textarea
      id="comments"
      rows="3"
      placeholder="Enter approval notes or reason for rejection"
    ></textarea>
  </div>

  <div class="actions">
    <button
      class="approve"
      type="button"
      onclick="submitDecision(true)"
    >
      Approve Remediation
    </button>

    <button
      class="reject"
      type="button"
      onclick="submitDecision(false)"
    >
      Reject Remediation
    </button>
  </div>

  <div id="result" role="status" aria-live="polite"></div>

  <small>
    Human approval is required before remediation execution.
    No real infrastructure changes will be performed.
  </small>

</main>

<script>
  const buttons = document.querySelectorAll('button');
  const resultBox = document.getElementById('result');

  async function submitDecision(approved) {

    const incidentId = document.getElementById('incidentId').value.trim();
    const comments = document.getElementById('comments').value;

    if (!incidentId) {
      showResult('Please enter an incident ID.', 'error');
      return;
    }

    buttons.forEach(button => button.disabled = true);

    showResult('Submitting remediation decision...', 'info');

    try {
      const response = await fetch(
        `/api/incidents/${encodeURIComponent(incidentId)}/decision`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ approved, comments })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.detail || `HTTP ${response.status}`);
      }

      if (approved) {

        const execution = data.execution_result;

        let message =
          `Remediation Approved\n` +
          `Incident: ${data.incident_id}\n` +
          `Status: ${data.status}`;

        if (execution) {
          message +=
            `\nAction: ${execution.action}` +
            `\nExecution: ${execution.status}` +
            `\n${execution.message}`;
        }

        showResult(message, 'success');

      } else {

        showResult(
          `Remediation Rejected\n` +
          `Incident: ${data.incident_id}\n` +
          `Status: ${data.status}\n` +
          `No remediation action was executed.`,
          'error'
        );

      }

    } catch (error) {

      showResult(
        `Could not submit decision: ${error.message}`,
        'error'
      );

    } finally {

      buttons.forEach(button => button.disabled = false);

    }
  }

  function showResult(message, type) {
    resultBox.className = type;
    resultBox.textContent = message;
  }
</script>

</body>
</html>
