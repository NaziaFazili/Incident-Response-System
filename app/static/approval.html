<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incident Report Email Approval</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background: #f3f6fb; color: #1e293b; }
    main { background: white; width: min(100%, 510px); padding: 32px; border-radius: 16px; box-shadow: 0 14px 40px rgba(20,40,75,.09); }
    h1 { margin: 0 0 6px; font-size: 1.55rem; }
    p { margin: 0 0 24px; color: #64748b; }
    label { display: block; font-weight: 650; margin: 0 0 7px; font-size: .92rem; }
    input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; background: #fff; }
    input:focus, textarea:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
    .field { margin-bottom: 18px; }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button { flex: 1; padding: 13px 10px; border: none; border-radius: 8px; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .approve { background: #15803d; } .reject { background: #b91c1c; }
    #result { margin-top: 20px; padding: 12px 14px; border-radius: 8px; display: none; white-space: pre-wrap; overflow-wrap: anywhere; }
    #result.success { display: block; background: #dcfce7; color: #166534; }
    #result.error { display: block; background: #fee2e2; color: #991b1b; }
    small { display: block; margin-top: 18px; color: #64748b; }
  </style>
</head>
<body>
<main>
  <h1>Incident Report Approval</h1>
  <p>Approve or reject emailing an incident report.</p>
  <div class="field">
    <label for="incidentId">Incident ID</label>
    <input id="incidentId" placeholder="INC-TEST-001" autocomplete="off" required />
  </div>
  <div class="field">
    <label for="comments">Comments (optional)</label>
    <textarea id="comments" rows="3" placeholder="Reason for approval or rejection"></textarea>
  </div>
  <div class="actions">
    <button class="approve" type="button" onclick="submitDecision(true)">Approve</button>
    <button class="reject" type="button" onclick="submitDecision(false)">Reject</button>
  </div>
  <div id="result" role="status" aria-live="polite"></div>

</main>
<script>
  const buttons = document.querySelectorAll('button');
  const resultBox = document.getElementById('result');
  async function submitDecision(approved) {
    const incidentId = document.getElementById('incidentId').value.trim();
    const comments = document.getElementById('comments').value;
    if (!incidentId) { showResult('Please enter an incident ID.', false); return; }
    buttons.forEach(b => b.disabled = true);
    showResult('Submitting decision...', true);
    try {
      const response = await fetch(`/api/incidents/${encodeURIComponent(incidentId)}/decision`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ approved, comments })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
      showResult(`Decision saved: ${data.status}\nIncident: ${data.incident_id}`, true);
    } catch (error) {
      showResult(`Could not submit decision: ${error.message}`, false);
    } finally {
      buttons.forEach(b => b.disabled = false);
    }
  }
  function showResult(message, ok) {
    resultBox.className = ok ? 'success' : 'error';
    resultBox.textContent = message;
  }
</script>
</body>
</html>
